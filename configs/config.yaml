data:
  raw_csv_path: "data/raw/dataset.csv"
  target_column: "label"
  test_size: 0.2
  random_state: 42

model:
  type: "random_forest"
  params:
    n_estimators: 300
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    n_jobs: -1
    class_weight: "balanced"

output:
  model_dir: "models"
  metrics_path: "reports/metrics.json"

